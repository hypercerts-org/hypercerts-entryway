# Weekly version updates. Minor and patch bumps are grouped into one PR per
# ecosystem; major bumps get their own PRs. New releases wait 7 days before
# Dependabot proposes them. Security updates are configured separately, in the
# organization's code security settings.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /scripts/lint
      - /tests/atmosphere/examples/entryway-oauth-web-app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /tests/atmosphere/examples/entryway-oauth-web-app
      - /tests/support
      - /tests/support/goat
      - /tests/support/pds-moover
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directories:
      - /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
