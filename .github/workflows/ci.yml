name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
env:
  ENTRYWAY_DOCKER_CONTEXT: default
  DOCKER_CONTEXT: default
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.22.0
      - name: Install application dependencies
        run: npm ci --ignore-scripts
      - name: Set up reviewed native dependencies
        run: npm rebuild better-sqlite3 esbuild
      - name: Install isolated lint dependencies
        run: npm ci --ignore-scripts --prefix scripts/lint
      - name: test:hooks
        run: npm run test:hooks
      - name: format:check
        run: npm run format:check
      - name: lint
        run: npm run lint
      - name: check
        run: npm run check
      - name: typecheck
        run: npm run typecheck
      - name: check:architecture
        run: npm run check:architecture
      - name: test:architecture
        run: npm run test:architecture
      - name: schema:check
        run: npm run schema:check
      - name: build
        run: npm run build
      - name: test:unit
        run: npm run test:unit
      - name: test:ci-lifecycle
        run: npm run test:ci-lifecycle
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_CHECKOUT: ${{ github.workspace }}
      SANDBOX_PROJECT: hypercerts-entryway-ci-integration-${{ github.run_id }}-${{ github.run_attempt }}
      SANDBOX_CHECKOUT: ${{ github.workspace }}/tests/.runtime/ci-integration-${{ github.run_id }}-${{ github.run_attempt }}
      ACCEPTANCE_REPORT_DIR: ${{ github.workspace }}/tests/artifacts/ci-integration-${{ github.run_id }}-${{ github.run_attempt }}/reports
      CI_OWNERSHIP_MANIFEST: ${{ github.workspace }}/tests/artifacts/ci-integration-${{ github.run_id }}-${{ github.run_attempt }}/ownership.json
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.22.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.8.3
      - name: Verify standard hosted Docker
        run: |
          source tests/support/rootless-docker.sh
          test "$DOCKER_CONTEXT" = default
          docker --context default compose version
          deno --version
      - name: Register owned project before provisioning
        run: |
          python3 scripts/ci-ownership.py init "$CI_OWNERSHIP_MANIFEST"
          python3 scripts/ci-ownership.py register "$CI_OWNERSHIP_MANIFEST" "$SANDBOX_CHECKOUT" "$SANDBOX_PROJECT"
          mkdir -p "$SANDBOX_CHECKOUT" "$ACCEPTANCE_REPORT_DIR"
      - name: Install pinned AiaB dependencies and configure sandbox
        run: |
          bash tests/local.sh prepare
      - name: Build and start managed application and test images
        run: |
          bash tests/local.sh up
      - name: browser
        run: |
          bash tests/local.sh browser
      - name: contracts
        run: |
          bash tests/local.sh contracts
      - name: migration
        run: |
          bash tests/local.sh migration
      - name: Assert only the declared moderation gap
        run: |
          status=0
          bash tests/local.sh interop-profile || status=$?
          printf "%s\n" "$status" > "$ACCEPTANCE_REPORT_DIR/interop-profile-exit.txt"
          docker --context "$DOCKER_CONTEXT" compose --project-name "$SANDBOX_PROJECT" -f "$SANDBOX_CHECKOUT/compose.yaml" run --rm --no-deps test node tests/support/assert-interop-profile.mjs /app/artifacts/interop-profile.json "$status" /app/artifacts/interop-profile-acceptance.json
      - name: plc-recovery
        run: |
          bash tests/local.sh plc-recovery
      - name: process-crash
        run: |
          bash tests/local.sh process-crash
      - name: managed-recovery
        run: |
          bash tests/local.sh managed-recovery
      - name: authority-drills
        run: |
          bash tests/local.sh authority-drills
      - name: resilience
        run: |
          bash tests/local.sh resilience
      - name: Clean only recorded projects and children
        if: always()
        run: |
          if test -f "$CI_OWNERSHIP_MANIFEST"; then
            python3 scripts/ci-ownership.py cleanup "$CI_OWNERSHIP_MANIFEST"
          fi
  databases:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SOURCE_CHECKOUT: ${{ github.workspace }}
      SANDBOX_PROJECT: hypercerts-entryway-ci-databases-${{ github.run_id }}-${{ github.run_attempt }}
      SANDBOX_CHECKOUT: ${{ github.workspace }}/tests/.runtime/ci-databases-${{ github.run_id }}-${{ github.run_attempt }}
      ACCEPTANCE_REPORT_DIR: ${{ github.workspace }}/tests/artifacts/ci-databases-${{ github.run_id }}-${{ github.run_attempt }}/reports
      CI_OWNERSHIP_MANIFEST: ${{ github.workspace }}/tests/artifacts/ci-databases-${{ github.run_id }}-${{ github.run_attempt }}/ownership.json
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.22.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.8.3
      - name: Verify standard hosted Docker
        run: |
          source tests/support/rootless-docker.sh
          test "$DOCKER_CONTEXT" = default
          docker --context default compose version
          deno --version
      - name: Register owned project before provisioning
        run: |
          python3 scripts/ci-ownership.py init "$CI_OWNERSHIP_MANIFEST"
          python3 scripts/ci-ownership.py register "$CI_OWNERSHIP_MANIFEST" "$SANDBOX_CHECKOUT" "$SANDBOX_PROJECT"
          mkdir -p "$SANDBOX_CHECKOUT" "$ACCEPTANCE_REPORT_DIR"
      - name: Install pinned AiaB dependencies and configure sandbox
        run: |
          bash tests/local.sh prepare
      - name: Build and start managed application and test images
        env:
          DATABASE_BACKEND: postgresql
          DEPLOYMENT_MODE: single-node
          DATABASE_URL: postgresql://authority_owner@entryway-postgres/account_authority
        run: |
          bash tests/local.sh up
      - name: SQLite and PostgreSQL contracts
        run: |
          bash tests/local.sh database-dialects
      - name: PostgreSQL login restart and restore
        env:
          POSTGRESQL_PROFILE_REUSE_SANDBOX: "1"
        run: |
          bash tests/support/run-postgresql-profile.sh
      - name: Clean only recorded projects and children
        if: always()
        run: |
          if test -f "$CI_OWNERSHIP_MANIFEST"; then
            python3 scripts/ci-ownership.py cleanup "$CI_OWNERSHIP_MANIFEST"
          fi
  profiles:
    name: profiles (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile:
          [sqlite-single-node, postgresql-single-node, postgresql-multi-node]
    env:
      SOURCE_CHECKOUT: ${{ github.workspace }}
      SANDBOX_PROJECT: hypercerts-entryway-ci-profile-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
      SANDBOX_CHECKOUT: ${{ github.workspace }}/tests/.runtime/ci-profile-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
      ACCEPTANCE_REPORT_DIR: ${{ github.workspace }}/tests/artifacts/ci-profile-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}/reports
      CI_OWNERSHIP_MANIFEST: ${{ github.workspace }}/tests/artifacts/ci-profile-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}/ownership.json
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24.22.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.8.3
      - name: Verify standard hosted Docker
        run: |
          source tests/support/rootless-docker.sh
          test "$DOCKER_CONTEXT" = default
          docker --context default compose version
          deno --version
      - name: Register owned project before provisioning
        run: |
          python3 scripts/ci-ownership.py init "$CI_OWNERSHIP_MANIFEST"
          python3 scripts/ci-ownership.py register "$CI_OWNERSHIP_MANIFEST" "$SANDBOX_CHECKOUT" "$SANDBOX_PROJECT"
          mkdir -p "$SANDBOX_CHECKOUT" "$ACCEPTANCE_REPORT_DIR"
      - name: Initialize deployment profile collection
        run: |
          echo "PROFILE_COLLECTION_INDEX=$ACCEPTANCE_REPORT_DIR/profiles-${{ matrix.profile }}.tsv" >> "$GITHUB_ENV"
          echo "KEEP_PROFILE_SANDBOX=1" >> "$GITHUB_ENV"
      - name: ${{ matrix.profile }}
        run: |
          bash tests/support/run-resilience-profile.sh "${{ matrix.profile }}"
      # Only the files assert-resilience-profiles.mjs reads. Logs, commands and
      # browser output can contain mailbox codes or sandbox identity.
      - name: Upload deployment profile receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resilience-profile-${{ matrix.profile }}
          path: |
            ${{ env.ACCEPTANCE_REPORT_DIR }}/profiles-${{ matrix.profile }}.tsv
            ${{ env.ACCEPTANCE_REPORT_DIR }}/resilience-${{ matrix.profile }}-*/prepare.exit
            ${{ env.ACCEPTANCE_REPORT_DIR }}/resilience-${{ matrix.profile }}-*/up.exit
            ${{ env.ACCEPTANCE_REPORT_DIR }}/resilience-${{ matrix.profile }}-*/exercise.exit
            ${{ env.ACCEPTANCE_REPORT_DIR }}/resilience-${{ matrix.profile }}-*/assert-profile.exit
            ${{ env.ACCEPTANCE_REPORT_DIR }}/resilience-${{ matrix.profile }}-*/profile.exit
            ${{ env.ACCEPTANCE_REPORT_DIR }}/resilience-${{ matrix.profile }}-*/resilience-profile.json
            ${{ env.ACCEPTANCE_REPORT_DIR }}/resilience-${{ matrix.profile }}-*/profile-duration.json
            ${{ env.ACCEPTANCE_REPORT_DIR }}/resilience-${{ matrix.profile }}-*/exercise-controller.json
          if-no-files-found: warn
          retention-days: 7
      - name: Clean only recorded projects and children
        if: always()
        run: |
          if test -f "$CI_OWNERSHIP_MANIFEST"; then
            python3 scripts/ci-ownership.py cleanup "$CI_OWNERSHIP_MANIFEST"
          fi
  profiles-assert:
    name: profiles (assert all receipts)
    needs: profiles
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: resilience-profile-*
          merge-multiple: true
          path: ${{ runner.temp }}/profiles
      - name: Combine profile collection index
        run: |
          cat "$RUNNER_TEMP"/profiles/profiles-*.tsv > "$RUNNER_TEMP/profiles/profiles.tsv"
          mkdir -p "$RUNNER_TEMP/assert-output"
      # The receipts record a digest of the candidate files inside the test image.
      # Build the same image from the same Dockerfile and context to recompute it.
      - name: Build candidate test image
        run: |
          docker --context default build -f tests/support/Dockerfile -t entryway-profile-assert:local .
      - name: Assert all deployment profile receipts
        run: |
          docker --context default run --rm -v "$RUNNER_TEMP/profiles:/profiles:ro" -v "$RUNNER_TEMP/assert-output:/app/artifacts:z" entryway-profile-assert:local node tests/support/assert-resilience-profiles.mjs
