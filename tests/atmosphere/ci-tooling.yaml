services:
  tooling:
    image: node:24-bookworm-slim
    working_dir: /source
    volumes:
      - ${SOURCE_CHECKOUT:?}:/source
    command: sh -ec 'npm install --package-lock-only --ignore-scripts --no-audit --no-fund; npm install --prefix scripts/lint --package-lock-only --ignore-scripts --no-audit --no-fund'
  checks:
    build:
      context: ${SOURCE_CHECKOUT:?}
      dockerfile: tests/support/Dockerfile
      target: ci
    network_mode: none
    volumes:
      - ${ACCEPTANCE_REPORT_DIR:?}:/app/artifacts
