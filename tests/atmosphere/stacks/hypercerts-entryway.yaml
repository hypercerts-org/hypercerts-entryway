x-runtime: &runtime
  image: ${SANDBOX_PROJECT:-hypercerts-entryway}:local
  build:
    context: ../..
    dockerfile: tests/support/Dockerfile
  init: true
  environment: &runtime-env
    DATABASE_BACKEND: ${DATABASE_BACKEND:-sqlite}
    DATABASE_URL: ${DATABASE_URL:-}
    DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-single-node}
    SERVICE_CONFIG_PATH: /config/config.json
    NODE_EXTRA_CA_CERTS: /ca/root.crt
    LOG_LEVEL: warn
  networks: [atmosinabox]
services:
  entryway-postgres:
    image: postgres:16.15-alpine3.24
    profiles: [database]
    environment:
      POSTGRES_DB: account_authority
      POSTGRES_USER: authority_owner
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - entryway-postgres-data:/var/lib/postgresql/data
      - database-profile-backup:/backup
    networks: [atmosinabox]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U authority_owner -d account_authority]
      interval: 1s
      timeout: 3s
      retries: 30
  configure:
    <<: *runtime
    command: node tests/support/configure.mjs
    environment:
      SERVICE_CONFIG_PATH: /config/config.json
      SERVICE_HANDLE_DOMAINS: .entryway.atmosbox.test
      OAUTH_CLIENT_URL: https://client.entryway.example.com
      SOURCE_FIXTURE_PUBLIC_DIR: /run/fixture-public
      SOURCE_FIXTURE_TOKEN_DIR: /run/secrets
    volumes:
      - entryway-config:/config
      - source-fixture-public:/run/fixture-public
      - source-fixture-token:/run/secrets
  entryway: &entryway-node
    <<: *runtime
    stop_grace_period: 20s
    command: node dist/src/main.mjs
    volumes:
      - ../artifacts:/app/artifacts:z
      - entryway-config:/config:ro
      - entryway-data:/data
      - source-fixture-token:/run/secrets:ro
    environment:
      <<: *runtime-env
      MAIL_SMTP_HOST: mail-capture
      MAIL_SMTP_PORT: '2525'
      BROWSER_CLIENT_METADATA_URL: https://browser.atmosbox.internal/oauth-client-metadata.json
      SOURCE_FIXTURE_URL: http://source-fixture:3313
      SOURCE_FIXTURE_TOKEN_FILE: /run/secrets/source-fixture-token
    depends_on:
      configure: { condition: service_completed_successfully }
      plc: { condition: service_healthy }
      mail-capture: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://localhost:3000/_health").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))']
      interval: 3s
      timeout: 3s
      retries: 60
  pds1:
    <<: *runtime
    command: node tests/support/start-pds.mjs
    environment:
      <<: *runtime-env
      PDS_ID: pds1
    volumes:
      - entryway-config:/config:ro
      - cluster1-data:/data
    depends_on:
      entryway: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://localhost:3000/xrpc/_health").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))']
      interval: 3s
      timeout: 3s
      retries: 60
  pds2:
    <<: *runtime
    command: node tests/support/start-pds.mjs
    environment:
      <<: *runtime-env
      PDS_ID: pds2
    volumes:
      - entryway-config:/config:ro
      - cluster2-data:/data
    depends_on:
      entryway: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://localhost:3000/xrpc/_health").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))']
      interval: 3s
      timeout: 3s
      retries: 60
  test:
    <<: *runtime
    profiles: [test]
    command: node tests/support/run-contracts.mjs
    environment:
      <<: *runtime-env
      MAILPIT_URL: https://mailpit.atmosbox.test
    volumes:
      - entryway-config:/config:ro
      - entryway-data:/entryway-data:ro
      - mail-capture-data:/capture:ro
      - database-profile-data:/profile
      - source-fixture-token:/run/secrets:ro
      - ../artifacts:/app/artifacts:z
    depends_on:
      pds1: { condition: service_healthy }
      pds2: { condition: service_healthy }
  browser:
    image: ${SANDBOX_PROJECT:-hypercerts-entryway}-browser:local
    build:
      context: ../..
      dockerfile: tests/support/Dockerfile.browser
    profiles: [test]
    init: true
    working_dir: /app
    environment:
      <<: *runtime-env
      CI: '1'
      MAILPIT_URL: https://mailpit.atmosbox.test
    volumes:
      - entryway-config:/config:ro
      - entryway-data:/entryway-data
      - mail-capture-data:/capture:ro
      - ../artifacts:/app/artifacts:z
    depends_on:
      pds1: { condition: service_healthy }
      pds2: { condition: service_healthy }
    shm_size: 1gb
volumes:
  entryway-postgres-data: {}
  database-profile-data: {}
  database-profile-backup: {}
  entryway-config: {}
  entryway-data: {}
  cluster1-data: {}
  cluster2-data: {}
